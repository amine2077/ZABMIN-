name: zabmin
description: "Zabmin - Local system monitoring dashboard"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.3
  fl_chart: ^1.0.0
  provider: ^6.1.5
  window_manager: ^0.4.3
  google_fonts: ^6.3.0
  sqflite_common_ffi: ^2.3.3
  path_provider: ^2.1.4
  file_picker: ^8.1.4
  shared_preferences: ^2.3.0
  launch_at_startup: ^0.5.0
  tray_manager: ^0.5.0
  local_notifier: ^0.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
